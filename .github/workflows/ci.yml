name: CI

on:
  push:
    branches: [master, main, develop]
    tags: ['v*']
  pull_request:
    branches: [master, main, develop]

env:
  NODE_ENV: test

# 同一分支/PR 的新提交触发时，取消正在运行的旧工作流，节省 CI 资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-node12:
    name: Published runtime / Node.js 12.22.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Pack published artifact
        id: package
        shell: bash
        run: echo "file=$(npm pack --ignore-scripts --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup minimum runtime Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '12.22.0'

      - name: Verify published runtime
        shell: bash
        run: |
          consumer_dir=$(mktemp -d)
          cd "$consumer_dir"
          npm init --yes --silent
          npm install "$GITHUB_WORKSPACE/${{ steps.package.outputs.file }}" --engine-strict --ignore-scripts --no-audit --no-fund
          node -e "const { createOSUtils } = require('node-os-utils'); const instance = createOSUtils({ cacheEnabled: false }); Promise.all([instance.disk.info(), instance.overview()]).then(([disk, overview]) => { if (!disk.success) throw disk.error; if (!overview || !overview.platform) throw new Error('Overview runtime smoke test failed'); instance.destroy(); console.log('CommonJS runtime smoke test passed'); }).catch(error => { instance.destroy(); console.error(error); process.exitCode = 1; });"
          node --input-type=module -e "import OSUtils, { createOSUtils } from 'node-os-utils'; if (typeof OSUtils !== 'function' || typeof createOSUtils !== 'function') throw new Error('ESM runtime smoke test failed'); const instance = createOSUtils(); instance.destroy(); console.log('ESM runtime smoke test passed');"

  test:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      # 单个矩阵组合失败不取消其余组合，保留完整的跨平台结果
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['20', '22', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        # Windows Runner 曾在 npm ci 阶段触发 "Exit handler never called"；跨平台矩阵保留 npm install。
        # lockfile 仍用于约束解析结果，且后续步骤会显式校验 TypeScript 安装。
        run: npm install --include=dev --production=false --no-audit --no-fund

      - name: Verify TypeScript dependency
        run: node -e "const pkg = require('typescript/package.json'); if (!pkg.version) throw new Error('TypeScript package metadata is missing its version'); console.log('TypeScript', pkg.version)"

      - name: Display versions
        run: |
          node --version
          npm --version
          npx --no-install tsc --version

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint:check

      - name: Run all tests
        run: npm run test:platform

      # 覆盖率非阻断，仅在 ubuntu + Node 22 组合上运行一次（对应 Travis 的 after_success || true）
      - name: Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22'
        run: npm run test:coverage
        continue-on-error: true
