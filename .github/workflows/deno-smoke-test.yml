name: Deno Compatibility Smoke Test

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  deno-smoke-test:
    name: Deno Smoke Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 非阻断性：Deno 兼容层问题不应阻止合并，仅作可观测性指标
    continue-on-error: true

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --include=dev --production=false

      - name: Verify TypeScript dependency
        run: node -e "const pkg = require('typescript/package.json'); if (!pkg.version) throw new Error('TypeScript package metadata is missing its version'); console.log('TypeScript', pkg.version)"

      - name: Build
        run: npm run build

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno smoke test
        run: deno run --allow-read --allow-env --allow-sys test/deno/smoke-test.ts
        timeout-minutes: 2
